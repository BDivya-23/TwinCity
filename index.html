<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TwinCity: Digital Chennai</title>
    
    <!-- 1. Load the Leaflet Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. Your Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top-bar">
        <div class="logo">🏙️ TwinCity: Digital Chennai</div>
        <div class="badge">AI-Powered Digital Twin</div>
    </header>

    <!-- 3. THIS IS THE NEW INTERACTIVE MAP -->
    <div id="map"></div>

    <div id="dashboard">
        <h1>🏛️ Mayor Dashboard</h1>

        <h2>City Status</h2>
        <div class="stat"><span>💰 Budget</span><span id="budget">₹100 Cr</span></div>
        <div class="stat"><span>😊 Citizen Happiness</span><span id="happiness">85%</span></div>

        <h2>Selected Area</h2>
        <div id="problem-panel">Click a location on the map to begin.</div>
        
        <h2>What If? Simulator</h2>
        <div style="display:flex; gap:10px; margin-bottom: 10px;">
            <button class="action" style="margin-top:0; background: #3b82f6; color: white !important; font-size: 14px;" onclick="simulateWhatIf('metro')">🚇 Build Metro</button>
            <button class="action" style="margin-top:0; background: #10b981; color: white !important; font-size: 14px;" onclick="simulateWhatIf('drainage')">🌊 Fix Drainage</button>
        </div>
        
        <div id="what-if-result" style="display:none; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; border-left: 4px solid #3b82f6;"></div>
        
        <div style="display:flex; gap:10px; margin-bottom: 5px;">
            <button class="action" style="margin-top:0; background: rgba(59, 130, 246, 0.8);" onclick="quickPropose('Build a metro')">🚇 Build Metro</button>
            <button class="action" style="margin-top:0; background: rgba(16, 185, 129, 0.8);" onclick="quickPropose('Build a new drainage system')">🌊 Fix Drainage</button>
        </div>
        
        <h2>Propose a Solution</h2>
        <textarea id="proposal-input" placeholder="e.g., Build a new drainage system..."></textarea>
        <button class="action" onclick="evaluateProposal()">🔍 Evaluate Proposal</button>
        
        <div id="advisor-response"></div>
        <button class="action" id="approve-btn" onclick="approveProposal()" disabled>✅ Approve & Implement</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
